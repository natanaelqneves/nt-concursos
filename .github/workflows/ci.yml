name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  coletor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: collector
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Schema em dia com o modelo
        run: ntc schema --check
      - name: Dados de data/ passam no gate
        run: ntc validate

  site:
    runs-on: ubuntu-latest
    needs: coletor
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run build
