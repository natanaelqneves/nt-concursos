# Sonda do Querido Diário: cobertura na Paraíba e amostra da busca por concursos. Não grava nada.
name: Sonda Querido Diário

on:
  workflow_dispatch:
  pull_request:
    paths:
      - collector/src/ntc/sources/querido_diario.py
      - .github/workflows/sonda-qd.yml

permissions:
  contents: read

jobs:
  sonda:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - run: pip install -e collector
      - run: ntc qd-sonda
