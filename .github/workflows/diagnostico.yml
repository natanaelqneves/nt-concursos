# Diagnóstico manual: mostra no log os trechos de prazo dos editais avulsos (não grava nada).
name: Diagnóstico de editais avulsos

on:
  workflow_dispatch:
    inputs:
      so:
        description: "slugs separados por espaço (vazio = todos)"
        required: false

permissions:
  contents: read

jobs:
  trechos:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - run: pip install -e collector
      - run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Trechos
        env:
          SO: ${{ inputs.so }}
        run: |
          args=()
          [ -n "$SO" ] && args+=(--so $SO)
          ntc trechos "${args[@]}"
