# Sondagem temporária do M1: baixa páginas das fontes para estudar a estrutura.
# Sai do repositório antes do merge.
name: Sondagem bancas M4
on:
  push:
    branches: [sondagem-bancas]
    paths: [".github/workflows/sondagem.yml", "collector/sondagem/**"]
permissions:
  contents: write
jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Baixar
        run: |
          mkdir -p out
          UA="ntconcursos-coletor/0.2 (+https://ntconcursos.com.br/metodologia/; contato@ntconcursos.com.br)"
          baixar() { echo "== $1 -> $2"; curl -sS -L -A "$UA" --max-time 60 -o "out/$2" -D "out/$2.headers" -w "%{http_code} %{url_effective} %{size_download}\n" "$1" || true; }
          while read -r url nome; do [ -n "$url" ] && baixar "$url" "$nome"; done < collector/sondagem/urls.txt
      - name: Guardar no ramo sondagem-dados (cumulativo)
        run: |
          git clone -q --depth 1 -b sondagem-dados "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" acum || { mkdir acum; cd acum; git init -q -b sondagem-dados; cd ..; }
          cp -r out/. acum/
          cd acum
          git config user.name ntc-bot; git config user.email bot@ntconcursos.com.br
          git add -A; git commit -qm "sondagem $GITHUB_RUN_ID" || true
          git push -q "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY" HEAD:sondagem-dados
