# Coleta das bancas (uma fonte por vez, isoladas): 18h00 e 02h30 BRT.
# Cada fonte grava data/ e o log em data/execucoes/; o bot faz commit só se algo mudou
# e só depois de `ntc validate` passar. Fonte com erro não impede as outras.
name: Coletar bancas

on:
  schedule:
    - cron: "0 21 * * *"  # 18h00 BRT
    - cron: "30 5 * * *"  # 02h30 BRT
  workflow_dispatch:
    inputs:
      fonte:
        description: "fonte (vazio = todas)"
        required: false
        type: choice
        options: ["", cebraspe, fgv, aocp]
      so:
        description: "ids da fonte separados por espaço (ex.: tjpb26 PC_PE_26)"
        required: false

permissions:
  contents: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/pyproject.toml
      - run: pip install -e collector
      - run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - uses: actions/cache@v4
        with:
          path: .cache/http
          key: http-${{ github.run_id }}
          restore-keys: http-
      - name: Coletar
        env:
          FONTE: ${{ inputs.fonte }}
          SO: ${{ inputs.so }}
        run: |
          fontes="${FONTE:-cebraspe fgv aocp}"
          falhas=""
          for f in $fontes; do
            echo "::group::$f"
            args=(--fonte "$f" --cache .cache/http)
            [ -n "$SO" ] && args+=(--so $SO)
            ntc collect "${args[@]}" || falhas="$falhas $f"
            echo "::endgroup::"
          done
          echo "FALHAS=$falhas" >> "$GITHUB_ENV"
      - name: Validar
        run: ntc validate
      - name: Gravar
        run: |
          git config user.name "ntc-bot"
          git config user.email "bot@ntconcursos.com.br"
          git add data/
          if git diff --cached --quiet; then echo "nada mudou"; exit 0; fi
          git commit -q -m "dados: coleta ${FONTE:-bancas} $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
        env:
          FONTE: ${{ inputs.fonte }}
      - name: Falhou alguma fonte?
        if: env.FALHAS != ''
        run: |
          echo "::error::fonte(s) com falha:$FALHAS (ver data/execucoes/)"
          exit 1
