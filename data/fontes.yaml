# Allowlist de origens aceitas como evidência. O gate compara o host da URL final
# (após redirecionamentos) com estes domínios; subdomínios são aceitos.
# Para incluir uma banca nova: adicione a entrada em `fontes` e abra um PR.

sufixos_oficiais:
  - gov.br     # União, estados e municípios (inclui in.gov.br)
  - jus.br     # Judiciário
  - mp.br      # Ministério Público
  - leg.br     # Legislativo
  - def.br     # Defensorias
  - mil.br     # Forças Armadas

fontes:
  inlabs:
    nome: INLABS / Imprensa Nacional
    papel: descoberta
    dominios: [in.gov.br]
  fgv:
    nome: FGV Conhecimento
    papel: banca
    dominios: [conhecimento.fgv.br]
  cebraspe:
    nome: Cebraspe
    papel: banca
    dominios: [cebraspe.org.br]
  aocp:
    nome: Instituto AOCP
    papel: banca
    # anexos-r2.selecao.net.br: armazenamento dos PDFs da plataforma nova do AOCP (link oficial da API).
    # arquivos-site.institutoaocp.org.br (concursos antigos) tem robots.txt "Disallow: /": não é baixado.
    dominios: [institutoaocp.org.br, anexos-r2.selecao.net.br]
  fcc:
    nome: Fundação Carlos Chagas
    papel: banca
    dominios: [concursosfcc.com.br]
  vunesp:
    nome: Vunesp
    papel: banca
    dominios: [vunesp.com.br]

  # Bancas sem coletor próprio: o edital entra pela fonte "avulsos" (data/editais-avulsos.json).
  idecan:
    nome: Idecan
    papel: banca
    dominios: [idecan.org.br]
  comperve:
    nome: Comperve/UFRN
    papel: banca
    dominios: [comperve.ufrn.br]
  access:
    nome: Instituto Access
    papel: banca
    dominios: [access.org.br, access.selecao.net.br]

  # Cópias de editais publicadas por sites de notícias e cursos (papel: copia). Só entram
  # pela fonte "avulsos", quando o edital não está numa fonte oficial que alcançamos. O gate
  # confere o trecho no texto da cópia e a coleta compara as datas com as da imprensa; a página
  # do concurso informa que o documento é uma cópia e onde foi achado.
  qconcursos:
    nome: Qconcursos (cópia)
    papel: copia
    dominios: [arquivos.qconcursos.com]
  direcao:
    nome: Direção Concursos (cópia)
    papel: copia
    dominios: [cdn.direcaoconcursos.com.br]
  jcconcursos:
    nome: JC Concursos (cópia)
    papel: copia
    dominios: [jcconcursos.com.br]
  novaconcursos:
    nome: Nova Concursos (cópia)
    papel: copia
    dominios: [novaconcursos.com.br]
  editorasolucao:
    nome: Editora Solução (cópia)
    papel: copia
    dominios: [editorasolucao.com.br]
  magistrar:
    nome: Magistrar Cursos (cópia)
    papel: copia
    dominios: [magistrarcursos.com.br]
  acheconcursos:
    nome: Ache Concursos (cópia)
    papel: copia
    dominios: [acheconcursos.com.br]
  cdn-cloudfront:
    nome: CDN de portal de concursos (cópia)
    papel: copia
    dominios: [dhg1h5j42swfq.cloudfront.net]
