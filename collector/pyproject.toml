[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ntc"
version = "0.1.0"
description = "Coletor e verificador de concursos públicos do ntconcursos.com.br"
requires-python = ">=3.12"
dependencies = [
    # Fixado: o schema versionado foi gerado com esta versão. Versões novas do pydantic
    # mudam a saída de model_json_schema e fazem `ntc schema --check` falhar no CI.
    "pydantic==2.13.5",
    "pyyaml>=6",
    "requests>=2.31",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "lxml>=5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ntc = "ntc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
